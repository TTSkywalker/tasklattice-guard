# TaskLattice Guard uses SQLite and a ReadWriteOnce volume. Keep one replica.
replicaCount: 1

image:
  repository: ghcr.io/tasklattice/tasklattice-guard
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
# Service, Deployment, and Pod prefix. Keep the Helm release and retained
# storage names independent so a display-name change cannot switch databases.
workloadNameOverride: tali-guard

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: LoadBalancer
  port: 38081
  annotations: {}

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}
  # Preserve control-plane state when the Helm release is removed.
  retain: true
  mountPath: /var/lib/tasklattice/model-guardrails

database:
  path: /var/lib/tasklattice/model-guardrails/tasklattice-guard-policy-schema-v3.db

runtime:
  publicBaseUrl: http://localhost:38081

evaluators:
  nvidia:
    baseUrl: ""
    contentSafetyModel: ""
    topicControlModel: ""
    groundingModel: ""
    apiKey: ""
    existingSecret: ""
    secretKey: api-key
  deepJudge:
    baseUrl: ""
    model: ""
    apiKey: ""
    existingSecret: ""
    secretKey: api-key
  automatedReasoning:
    endpointUrl: ""
    apiKey: ""
    existingSecret: ""
    secretKey: api-key
  jailbreakDetection:
    nimBaseUrl: ""
    apiKey: ""
    existingSecret: ""
    secretKey: api-key

observability:
  runtimeP95BudgetMs: 2500
  runtimeP99BudgetMs: 5000
  maxConcurrencyPerGuardrail: 64
  openTelemetry:
    enabled: false
    endpoint: ""

controlPlaneAgent:
  deepseek:
    baseUrl: https://api.deepseek.com
    model: deepseek-v4-flash
    apiKey: ""
    existingSecret: ""
    secretKey: api-key

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: guard.tali.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  ingressFrom: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

startupProbe:
  enabled: true
  failureThreshold: 30
  periodSeconds: 2

livenessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

revisionHistoryLimit: 3
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

extraEnv: []
extraEnvFrom: []

test:
  image:
    repository: busybox
    tag: "1.36.1"
    pullPolicy: IfNotPresent
