{{- if not .Values.runtimeLogging.existingSecret }}
{{- $secretName := include "tasklattice-guard.runtimeLogSecretName" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingValue := "" -}}
{{- if $existingSecret -}}
{{- $existingData := get $existingSecret "data" | default dict -}}
{{- $existingValue = get $existingData .Values.runtimeLogging.secretKey | default "" -}}
{{- if not $existingValue -}}
{{- fail (printf "existing runtime log Secret %s does not contain key %s" $secretName .Values.runtimeLogging.secretKey) -}}
{{- end -}}
{{- end -}}
{{- $generatedFernetKey := randBytes 32 | replace "+" "-" | replace "/" "_" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "tasklattice-guard.labels" . | nindent 4 }}
  {{- if .Values.runtimeLogging.retainSecret }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{ .Values.runtimeLogging.secretKey }}: {{ if $existingValue }}{{ $existingValue | quote }}{{ else }}{{ $generatedFernetKey | b64enc | quote }}{{ end }}
{{- end }}
