{{- include "tasklattice-guard.validateValues" . }}
{{- if and (not .Values.playgroundChat.existingSecret) .Values.playgroundChat.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tasklattice-guard.playgroundChatSecretName" . }}
  labels:
    {{- include "tasklattice-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.playgroundChat.secretKey }}: {{ .Values.playgroundChat.apiKey | quote }}
{{- end }}
