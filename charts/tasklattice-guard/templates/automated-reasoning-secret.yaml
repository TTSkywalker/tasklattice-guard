{{- include "tasklattice-guard.validateValues" . }}
{{- if and (not .Values.evaluators.automatedReasoning.existingSecret) .Values.evaluators.automatedReasoning.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tasklattice-guard.automatedReasoningSecretName" . }}
  labels:
    {{- include "tasklattice-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.evaluators.automatedReasoning.secretKey }}: {{ .Values.evaluators.automatedReasoning.apiKey | quote }}
{{- end }}
