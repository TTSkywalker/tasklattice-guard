{{- include "tasklattice-guard.validateValues" . }}
{{- if and (not .Values.evaluators.deepJudge.existingSecret) .Values.evaluators.deepJudge.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tasklattice-guard.deepJudgeSecretName" . }}
  labels:
    {{- include "tasklattice-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.evaluators.deepJudge.secretKey }}: {{ .Values.evaluators.deepJudge.apiKey | quote }}
{{- end }}
