# Full GuardRails performance-debug overlay.
#
# Helm loads values.yaml first, so this file only needs to be added with:
#   --values ./charts/tali-guard/values-debug.yaml
#
# The default backend addresses target Tempo and Pyroscope Services in the
# monitoring namespace. Override them when the observability stack uses another
# namespace or Service name. The ServiceMonitor/PrometheusRule release label
# must match the local Prometheus Operator selector.
#
# This profile enables infrastructure telemetry only. It never enables
# GuardRail content capture; sensitive runtime logging remains a per-GuardRail
# operational choice.

observability:
  performanceDebug:
    enabled: true
  tracing:
    enabled: true
    otlpEndpoint: http://tempo.monitoring.svc.cluster.local:4318
    sampleRatio: 1.0
  profiling:
    enabled: true
    serverAddress: http://pyroscope.monitoring.svc.cluster.local:4040
    sampleRate: 100
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    labels:
      release: monitoring
  prometheusRule:
    enabled: true
    labels:
      release: monitoring
  grafanaDashboard:
    enabled: true
    labels:
      grafana_dashboard: "1"
    annotations: {}
