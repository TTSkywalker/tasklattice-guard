{{- include "tali-guard.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tali-guard.workloadName" . }}
  labels:
    {{- include "tali-guard.workloadLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    {{- if or .Values.database.url .Values.database.existingSecret }}
    type: RollingUpdate
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "tali-guard.workloadSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/evaluator-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/playground-chat-secret: {{ include (print $.Template.BasePath "/playground-chat-secret.yaml") . | sha256sum }}
        checksum/automated-reasoning-secret: {{ include (print $.Template.BasePath "/automated-reasoning-secret.yaml") . | sha256sum }}
        checksum/jailbreak-detection-secret: {{ include (print $.Template.BasePath "/jailbreak-detection-secret.yaml") . | sha256sum }}
        checksum/control-plane-agent-secret: {{ include (print $.Template.BasePath "/control-plane-agent-secret.yaml") . | sha256sum }}
        checksum/runtime-log-secret: {{ include (print $.Template.BasePath "/runtime-log-secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tali-guard.workloadSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tali-guard.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: guard
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          env:
            {{- if .Values.database.existingSecret }}
            - name: MODEL_GUARDRAILS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.secretKey | quote }}
            {{- else if .Values.database.url }}
            - name: MODEL_GUARDRAILS_DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- else }}
            - name: MODEL_GUARDRAILS_DATABASE_PATH
              value: {{ .Values.database.path | quote }}
            {{- end }}
            - name: MODEL_GUARDRAILS_PUBLIC_RUNTIME_BASE_URL
              value: {{ .Values.runtime.publicBaseUrl | quote }}
            - name: MODEL_GUARDRAILS_RUNTIME_P95_BUDGET_MS
              value: {{ .Values.observability.runtimeP95BudgetMs | quote }}
            - name: MODEL_GUARDRAILS_RUNTIME_P99_BUDGET_MS
              value: {{ .Values.observability.runtimeP99BudgetMs | quote }}
            - name: MODEL_GUARDRAILS_RUNTIME_MAX_CONCURRENCY_PER_GUARDRAIL
              value: {{ .Values.observability.maxConcurrencyPerGuardrail | quote }}
            - name: MODEL_GUARDRAILS_RUNTIME_LOG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali-guard.runtimeLogSecretName" . }}
                  key: {{ .Values.runtimeLogging.secretKey | quote }}
            - name: MODEL_GUARDRAILS_RUNTIME_LOG_RETENTION_DAYS
              value: {{ .Values.runtimeLogging.retentionDays | quote }}
            - name: MODEL_GUARDRAILS_OTEL_ENABLED
              value: {{ .Values.observability.openTelemetry.enabled | quote }}
            {{- with .Values.observability.openTelemetry.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.evaluators.nvidia.baseUrl }}
            - name: MODEL_GUARDRAILS_NVIDIA_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.evaluators.nvidia.contentSafetyModel }}
            - name: MODEL_GUARDRAILS_CONTENT_SAFETY_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.evaluators.nvidia.topicControlModel }}
            - name: MODEL_GUARDRAILS_TOPIC_CONTROL_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.evaluators.nvidia.groundingModel }}
            - name: MODEL_GUARDRAILS_GROUNDING_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.evaluators.nvidia.apiKey .Values.evaluators.nvidia.existingSecret }}
            - name: MODEL_GUARDRAILS_NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali-guard.nvidiaSecretName" . }}
                  key: {{ .Values.evaluators.nvidia.secretKey }}
            {{- end }}
            {{- with .Values.playgroundChat.baseUrl }}
            - name: MODEL_GUARDRAILS_PLAYGROUND_CHAT_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.playgroundChat.model }}
            - name: MODEL_GUARDRAILS_PLAYGROUND_CHAT_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.playgroundChat.apiKey .Values.playgroundChat.existingSecret }}
            - name: MODEL_GUARDRAILS_PLAYGROUND_CHAT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali-guard.playgroundChatSecretName" . }}
                  key: {{ .Values.playgroundChat.secretKey }}
            {{- end }}
            {{- with .Values.evaluators.automatedReasoning.endpointUrl }}
            - name: MODEL_GUARDRAILS_AUTOMATED_REASONING_ENDPOINT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.evaluators.automatedReasoning.apiKey .Values.evaluators.automatedReasoning.existingSecret }}
            - name: MODEL_GUARDRAILS_AUTOMATED_REASONING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali-guard.automatedReasoningSecretName" . }}
                  key: {{ .Values.evaluators.automatedReasoning.secretKey }}
            {{- end }}
            {{- with .Values.evaluators.jailbreakDetection.nimBaseUrl }}
            - name: MODEL_GUARDRAILS_JAILBREAK_NIM_BASE_URL
              value: {{ . | quote }}
            - name: MODEL_GUARDRAILS_JAILBREAK_NIM_SERVER_ENDPOINT
              value: {{ $.Values.evaluators.jailbreakDetection.serverEndpoint | quote }}
            {{- end }}
            {{- if or .Values.evaluators.jailbreakDetection.apiKey .Values.evaluators.jailbreakDetection.existingSecret }}
            - name: MODEL_GUARDRAILS_JAILBREAK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali-guard.jailbreakDetectionSecretName" . }}
                  key: {{ .Values.evaluators.jailbreakDetection.secretKey }}
            - name: MODEL_GUARDRAILS_JAILBREAK_API_KEY_ENV_VAR
              value: MODEL_GUARDRAILS_JAILBREAK_API_KEY
            {{- end }}
            {{- with .Values.controlPlaneAgent.deepseek.baseUrl }}
            - name: MODEL_GUARDRAILS_CONTROL_PLANE_AI_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.controlPlaneAgent.deepseek.model }}
            - name: MODEL_GUARDRAILS_CONTROL_PLANE_AI_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.controlPlaneAgent.deepseek.apiKey .Values.controlPlaneAgent.deepseek.existingSecret }}
            - name: MODEL_GUARDRAILS_CONTROL_PLANE_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali-guard.deepseekSecretName" . }}
                  key: {{ .Values.controlPlaneAgent.deepseek.secretKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "tali-guard.persistenceClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
