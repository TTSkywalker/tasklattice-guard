{{- include "tali-guard.validateValues" . }}
{{- if and (not .Values.controlPlaneAgent.deepseek.existingSecret) .Values.controlPlaneAgent.deepseek.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali-guard.deepseekSecretName" . }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.controlPlaneAgent.deepseek.secretKey }}: {{ .Values.controlPlaneAgent.deepseek.apiKey | quote }}
{{- end }}
