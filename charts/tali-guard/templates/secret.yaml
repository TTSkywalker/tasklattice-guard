{{- if not .Values.security.controlSecret.existingSecret }}
{{- $name := include "tali-guard.controlSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.security.controlSecret.runnerTokenKey }}: {{ if $existing }}{{ index $existing.data .Values.security.controlSecret.runnerTokenKey }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{ .Values.security.controlSecret.betterAuthSecretKey }}: {{ if $existing }}{{ index $existing.data .Values.security.controlSecret.betterAuthSecretKey }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
{{- end }}

{{- if not .Values.security.runtimeLogs.existingSecret }}
{{- $name := include "tali-guard.runtimeLogSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.security.runtimeLogs.encryptionKeyKey }}: {{ if $existing }}{{ index $existing.data .Values.security.runtimeLogs.encryptionKeyKey }}{{ else }}{{ randBytes 32 | b64enc }}{{ end }}
{{- end }}

{{- if .Values.database.url }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali-guard.databaseSecretName" . }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ .Values.database.url | quote }}
{{- end }}

{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali-guard.postgresqlName" . }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  {{ .Values.postgresql.auth.passwordKey }}: {{ .Values.postgresql.auth.password | quote }}
  {{ .Values.database.secretKey }}: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "tali-guard.postgresqlName" .) .Values.postgresql.service.port .Values.postgresql.auth.database | quote }}
{{- end }}

{{- if not .Values.security.bootstrapAdmin.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali-guard.bootstrapAdminSecretName" . }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.security.bootstrapAdmin.emailKey }}: {{ .Values.security.bootstrapAdmin.email | quote }}
  {{ .Values.security.bootstrapAdmin.passwordKey }}: {{ .Values.security.bootstrapAdmin.password | quote }}
  {{ .Values.security.bootstrapAdmin.nameKey }}: {{ .Values.security.bootstrapAdmin.name | quote }}
{{- end }}

{{- if not .Values.security.artifactSigning.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali-guard.artifactSigningSecretName" . }}
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.security.artifactSigning.privateKeyKey }}: |
    {{- .Values.security.artifactSigning.privateKey | nindent 4 }}
  {{ .Values.security.artifactSigning.publicKeyKey }}: |
    {{- .Values.security.artifactSigning.publicKey | nindent 4 }}
{{ end }}

{{- if and (not .Values.security.controlTls.existingSecret) .Values.security.controlTls.autoGenerate }}
{{- $name := include "tali-guard.controlTlsSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "tali-guard.commonLabels" . | nindent 4 }}
type: Opaque
{{ if $existing }}
data:
  {{ .Values.security.controlTls.caKey }}: {{ index $existing.data .Values.security.controlTls.caKey }}
  {{ .Values.security.controlTls.controllerCertificateKey }}: {{ index $existing.data .Values.security.controlTls.controllerCertificateKey }}
  {{ .Values.security.controlTls.controllerPrivateKeyKey }}: {{ index $existing.data .Values.security.controlTls.controllerPrivateKeyKey }}
  {{ .Values.security.controlTls.runnerCertificateKey }}: {{ index $existing.data .Values.security.controlTls.runnerCertificateKey }}
  {{ .Values.security.controlTls.runnerPrivateKeyKey }}: {{ index $existing.data .Values.security.controlTls.runnerPrivateKeyKey }}
{{ else }}
{{ $ca := genCA (printf "%s-ca" (include "tali-guard.fullname" .)) 3650 }}
{{ $controllerName := include "tali-guard.controllerName" . }}
{{ $controllerDns := list $controllerName (printf "%s.%s" $controllerName .Release.Namespace) (printf "%s.%s.svc" $controllerName .Release.Namespace) (printf "%s.%s.svc.cluster.local" $controllerName .Release.Namespace) }}
{{ $controller := genSignedCert $controllerName nil $controllerDns 3650 $ca }}
{{ $runnerName := include "tali-guard.defaultRunnerName" . }}
{{ $runner := genSignedCert $runnerName nil (list $runnerName) 3650 $ca }}
stringData:
  {{ .Values.security.controlTls.caKey }}: |
    {{- $ca.Cert | nindent 4 }}
  {{ .Values.security.controlTls.controllerCertificateKey }}: |
    {{- $controller.Cert | nindent 4 }}
  {{ .Values.security.controlTls.controllerPrivateKeyKey }}: |
    {{- $controller.Key | nindent 4 }}
  {{ .Values.security.controlTls.runnerCertificateKey }}: |
    {{- $runner.Cert | nindent 4 }}
  {{ .Values.security.controlTls.runnerPrivateKeyKey }}: |
    {{- $runner.Key | nindent 4 }}
{{ end }}
{{ end }}
