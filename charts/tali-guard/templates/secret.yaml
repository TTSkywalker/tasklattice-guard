{{- include "tali-guard.validateValues" . }}
{{- if and (not .Values.evaluators.nvidia.existingSecret) .Values.evaluators.nvidia.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali-guard.nvidiaSecretName" . }}
  labels:
    {{- include "tali-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.evaluators.nvidia.secretKey }}: {{ .Values.evaluators.nvidia.apiKey | quote }}
{{- end }}
