# Single-binary, ephemeral profile backend for local troubleshooting.
pyroscope:
  disableSelfProfile: true
  extraArgs:
    log.level: info
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 768Mi
  persistence:
    enabled: false
minio:
  enabled: false
serviceMonitor:
  enabled: true
  labels:
    release: monitoring
