name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.0

      - name: Lint standalone chart
        run: helm lint charts/tasklattice-guard --strict

      - name: Render default TALI deployment
        run: >-
          helm template tasklattice-guard charts/tasklattice-guard
          --namespace tali
          --set-string auth.apiKey=ci-test-key
          > /tmp/tasklattice-guard.yaml

      - name: Package chart
        run: helm package charts/tasklattice-guard --destination /tmp

  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install UI dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck and build UI
        working-directory: web
        run: npm run typecheck && npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv==0.9.10

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run tests
        run: uv run pytest -q
